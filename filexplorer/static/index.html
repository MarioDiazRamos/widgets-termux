
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorador de Archivos</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <div class="contenedor-principal">
        <header class="encabezado">
            <button id="boton-regresar" class="boton-icono">&lt;</button>
            <h1 id="ruta-actual">/</h1>
        </header>
        <section class="busqueda">
            <input type="text" id="entrada-busqueda" placeholder="Buscar texto o expresión...">
            <button id="boton-buscar">Buscar</button>
            <label for="alternar-regex" class="etiqueta-regex">
                <input type="checkbox" id="alternar-regex"> Expresión
            </label>
        </section>
        <section id="resultados-busqueda" class="oculto">
            <h3>Resultados de búsqueda</h3>
            <div id="lista-resultados"></div>
        </section>
        <main id="lista-archivos">
            <div class="mensaje">Cargando...</div>
        </main>
    </div>

    <div id="modal-editor" class="modal oculto">
        <div class="contenido-modal">
            <header class="encabezado-modal">
                <span id="nombre-archivo-editor"></span>
                <div class="acciones-modal">
                    <button id="boton-guardar" class="boton-accion">Guardar</button>
                    <button id="boton-cerrar" class="boton-accion">Cerrar</button>
                </div>
            </header>
            <div class="contenedor-editor">
                <textarea id="contenido-archivo" class="editor-codigo"></textarea>
            </div>
        </div>
    </div>
    <script src="static/app.js"></script>
</body>
</html>
