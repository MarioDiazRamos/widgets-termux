<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Streamio - Streaming P2P</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
  <div class="container py-4">
    <h1 class="mb-4">Streamio <small class="text-secondary">(Stremio+Torrentio local)</small></h1>
    <form id="form-buscar" class="mb-3">
      <div class="input-group">
        <input type="text" class="form-control" id="q" placeholder="Buscar película o serie..." required>
        <button class="btn btn-primary" type="submit">Buscar</button>
      </div>
    </form>
    <div id="resultados"></div>
    <div id="player" class="mt-4"></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
